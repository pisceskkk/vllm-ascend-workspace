          "the local vllm submodule is being aligned for vllm-ascend validation",
          "a previously hard-coded vllm main commit may no longer match current vllm-ascend ci"
        ],
        "first_seen_at": "2026-08-10T09:21:12Z",
        "last_verified_at": "2026-08-10T09:21:12Z",
        "occurrence_count": 1,
        "owner_skill": "repo-init",
        "resolution": "Resolve the revision at execution time with .agents/skills/repo-init/scripts/resolve_vllm_ci_pin.py, then checkout and verify vllm at the returned exact commit before building, syncing, or validating vllm-ascend.",
        "root_cause": "The verified vLLM main revision is a moving compatibility contract owned by vllm-ascend CI, so a commit copied into documentation or an agent prompt becomes stale.",
        "scope": {
          "component": [
