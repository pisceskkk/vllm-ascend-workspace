        "resolution": "Resolve and verify the revision at execution time with .agents/scripts/vllm_version_pairing.py. Use an explicitly user-supplied vLLM commit only when present; otherwise accept only .github/vllm-main-verified.commit from the checked-out vllm-ascend HEAD. Checkout the returned exact commit and require the pairing gate to report ready before syncing, building, or validating.",
