    {
      "applicable_versions": "all workspace-managed vllm and vllm-ascend revisions deployed from an editable or materialized runtime source tree",
      "id": "python-only-vllm-ascend-rollback-materialize-restart",
      "rule": {
        "avoidance": "Do not apply this shortcut when either repository changes requirements, pyproject, setup, CMake/cmake, csrc, generated operator artifacts, native source/header files, native ABI, or dependency metadata. Also do not use it when the runtime is not already installed as an editable/materialized source tree; use the install/build path in those cases.",
        "candidate_id": "python-only-vllm-ascend-rollback-no-operator-rebuild",
        "candidate_ids": [
          "python-only-vllm-ascend-rollback-no-operator-rebuild"
        ],
        "confidence": "high",
        "evidence": [
          {
            "kind": "commit-range",
            "stable": true,
            "uri": "git:c628bdd4b..f22db9f10"
          },
          {
            "kind": "run-artifact",
            "stable": false,
            "uri": ".vaws-local/correctness/dsa-o-proj-dcp-off-20260728/rollback-full-20260728/evidence/manifest-1785207492-cf3a94c9.json"
          },
          {
            "kind": "code",
            "stable": true,
            "uri": ".agents/skills/remote-code-parity/scripts/remote_code_parity.py:VLLM_REINSTALL_PATTERNS"
          }
        ],
        "fingerprints": [
          "the complete vllm and/or vllm-ascend diff contains only .py files",
          "the diff contains no reinstall-trigger path, native ABI change, generated operator artifact, or dependency metadata change",
          "apply_mode=materialize updates the runtime source tree while skipping package reinstall and native/custom-operator rebuild"
        ],
        "first_seen_at": "2026-07-28T03:00:04Z",
        "last_verified_at": "2026-07-28T03:00:04Z",
        "occurrence_count": 1,
        "owner_skill": "remote-code-parity",
        "resolution": "Verify the complete change across vllm and vllm-ascend is limited to .py files, materialize the exact source snapshots, and fully restart the API server, EngineCore, and workers so no process retains old modules. Skip package reinstall and native/custom-operator compilation for both repositories.",
        "root_cause": "Pure Python modifications in either vllm or vllm-ascend do not change their compiled extensions or Ascend custom-operator binaries. On an editable/materialized runtime source tree, materializing the exact snapshots and fully restarting all Python processes is sufficient for the new Python logic to take effect.",
        "scope": {
          "change_type": [
            "python-only-change"
          ],
          "component": [
            "vllm-python-source",
            "vllm-ascend-python-source",
            "remote-code-parity",
            "native-extension-build",
            "custom-operator-build"
          ]
        },
        "summary": "Pure Python vllm or vllm-ascend changes require materialize and restart, not operator rebuild",
        "symptom": "A vllm or vllm-ascend change that touches only Python sources is treated as if native extensions or custom Ascend operators must be rebuilt.",
        "verification": {
          "checks": [
            "The full six-commit rollback diff contained 20 changed paths and every path ended in .py.",
            "Remote-code-parity snapshot 20260728T024845Z-a4aa39cf materialized successfully with reinstall=skipped-by-apply-mode.",
            "The rollback-point test tests/ut/attention/test_sfa_o_proj_tp.py passed 2 tests in the dcp29 container.",
            "The W4A8 TP8 eager service reached healthy and exposed /v1/models after a full worker restart without reinstall or operator rebuild.",
            "The shared VLLM_REINSTALL_PATTERNS excludes .py paths for vllm, and vllm-ascend extends that same pattern set only with its generated custom-operator directory."
          ],
          "status": "passed"
        }
      },
      "source": "generalized from promoted candidate python-only-vllm-ascend-rollback-no-operator-rebuild and the shared vllm/vllm-ascend reinstall trigger matrix; stable evidence: git:c628bdd4b..f22db9f10 and remote_code_parity.py",
      "status": "experimental",
      "updated_at": "2026-07-28"
    },
